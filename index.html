<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Si j’étais toi</title>
    <meta
      name="description"
      content="Vivre quelques mois dans la peau de plusieurs personnes, décider de règles qui s'appliquent à toutes, et voir ce que cela change."
    />
    <meta name="referrer" content="no-referrer" />
    <!-- Sans icône déclarée, le navigateur demande /favicon.ico, reçoit une
         404 et l'inscrit en erreur dans la console. Celle-ci est un sceau
         comme ceux des personnages, servi depuis le site même. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Content-Security-Policy par balise, parce que GitHub Pages ne permet
      aucun en-tête HTTP personnalisé.

      Elle couvre l'essentiel : rien ne peut être chargé ni envoyé ailleurs.
      Deux directives ne fonctionnent PAS par balise et sont donc perdues :
      frame-ancestors, qui empêche l'inclusion du site dans une iframe
      tierce, et Permissions-Policy. Le risque est faible ici — aucun
      identifiant, aucune action aux conséquences durables — mais il est
      réel, et c'est le prix de GitHub Pages. public/_headers reste présent
      pour un hébergeur qui les respecterait.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
