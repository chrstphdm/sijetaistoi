name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

# Déploiement sur Cloudflare Pages.
#
# GitHub Pages ne permet aucun en-tête HTTP personnalisé, donc aucune vraie
# Content-Security-Policy. Ce site manipule des opinions politiques : public/_headers
# interdit toute requête tierce, et une simple police distante suffirait à transmettre
# une adresse corrélée à une session.
#
# Deux secrets à renseigner dans Settings > Secrets and variables > Actions :
#   CLOUDFLARE_API_TOKEN  — jeton avec la permission « Cloudflare Pages : Edit »
#   CLOUDFLARE_ACCOUNT_ID — identifiant de compte, visible dans le tableau de bord
jobs:
  publier:
    runs-on: ubuntu-latest
    # Tant que les secrets ne sont pas renseignés, le job est ignoré plutôt
    # que de faire échouer chaque poussée.
    if: ${{ github.repository_owner != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # Le build enchaîne contenu, lint et contrastes : rien ne part en ligne
      # si une garantie de neutralité est enfreinte.
      - run: npm run build

      - name: Vérifier que les secrets sont présents
        id: secrets
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "pret=true" >> "$GITHUB_OUTPUT"
          else
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets Cloudflare absents — déploiement ignoré."
          fi

      - name: Publier sur Cloudflare Pages
        if: steps.secrets.outputs.pret == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sijetaistoi
